[project]
name = "ai-yordamchi"
version = "0.1.0"
description = "O'zbekcha ovozli kompyuter yordamchisi: kompyuterni ovoz bilan boshqaradi, o'rganadi, plugin'lar bilan kengayadi"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["assistant", "voice", "uzbek", "llm", "agent", "automation", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Uzbek",
    "Topic :: Desktop Environment",
]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "psutil>=5.9",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "keyring>=25",
    "send2trash>=1.8",
    # Windows'da kompyuterni boshqarish qatlami
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pycaw>=20240316; sys_platform == 'win32'",
    "uiautomation>=2.0.20; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5", "numpy>=1.26", "pysilero-vad>=2", "openwakeword>=0.6",
         "livekit>=1.0",                                     # WebRTC echo cancellation
         "pyaudiowpatch>=0.2.12; sys_platform == 'win32'"]   # WASAPI loopback
vision = ["mss>=9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "scipy>=1.11"]
all = ["ai-yordamchi[voice,vision]"]

[project.scripts]
yordamchi = "yordamchi.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["yordamchi*"]

[tool.setuptools.package-data]
yordamchi = ["webui/*.html", "webui/assets/*", "plugins/builtin/*/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
